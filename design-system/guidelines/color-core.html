<!-- @dsCard group="Colors" viewport="700x150" subtitle="Page, ink and the yellow that carries the brand" name="Color Core" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px;background:var(--surface-page)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:78px;border-radius:var(--radius-md);height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--weight-medium) 11px/1.3 var(--font-sans)}
.sw span{font:var(--weight-regular) 10px/1.4 var(--font-sans);opacity:.7}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--paper);border:1px solid var(--border-hair);color:var(--ink-900)"><b>--paper</b><span>#FDFBF7</span></div>
  <div class="sw" style="background:var(--sun);color:var(--ink-900)"><b>--sun</b><span>#FFDD44</span></div>
  <div class="sw" style="background:var(--ink-900);color:var(--paper)"><b>--ink-900</b><span>#1B2733</span></div>
  <div class="sw" style="background:var(--paper-warm);color:var(--ink-900)"><b>--paper-warm</b><span>#FDF4DE</span></div>
</div>
</body></html>
