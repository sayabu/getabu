<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px;background:var(--surface-page)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:78px;border-radius:var(--radius-md);height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--weight-medium) 11px/1.3 var(--font-sans)}
.sw span{font:var(--weight-regular) 10px/1.4 var(--font-sans);opacity:.7}
</style></head><body>
<div class="row" style="font-family:var(--font-sans)">
  <div class="sw" style="background:var(--sun);color:var(--ink-900);justify-content:center;font-weight:700">Ink on sun ✓ 11.6:1</div>
  <div class="sw" style="background:var(--ink-900);color:var(--sun);justify-content:center;font-weight:700">Sun on ink ✓ 11.6:1</div>
  <div class="sw" style="background:var(--paper);border:1px solid var(--border-hair);color:var(--sun);justify-content:center;font-weight:700">Sun on paper ✗ 1.4:1</div>
</div>
<p style="margin:14px 0 0;font:var(--weight-regular) 12px/1.5 var(--font-sans);color:var(--text-body)">Yellow is a <b>surface</b>, never a text colour on light. Ember is the only accent used for small type on paper.</p>
</body></html>
