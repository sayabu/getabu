<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px;background:var(--surface-page)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:78px;border-radius:var(--radius-md);height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--weight-medium) 11px/1.3 var(--font-sans)}
.sw span{font:var(--weight-regular) 10px/1.4 var(--font-sans);opacity:.7}
</style></head><body>
<div style="display:flex;align-items:center;gap:26px">
  <div style="display:flex;align-items:center;gap:11px">
    <div style="width:34px;height:34px;border-radius:var(--radius-squircle);background:var(--sun);display:flex;align-items:center;justify-content:center;font:900 19px/1 var(--font-display);color:var(--ink-900)">A</div>
    <span style="font:900 19px/1 var(--font-display);color:var(--text-strong)">Abu</span>
  </div>
  <div style="width:56px;height:56px;border-radius:18px;background:var(--sun);display:flex;align-items:center;justify-content:center;font:900 31px/1 var(--font-display);color:var(--ink-900)">A</div>
  <div style="width:34px;height:34px;border-radius:var(--radius-squircle);background:var(--ink-900);display:flex;align-items:center;justify-content:center;font:900 19px/1 var(--font-display);color:var(--sun)">A</div>
</div>
</body></html>
