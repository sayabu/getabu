<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Four radii plus the pill" name="Radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px;background:var(--surface-page)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:78px;border-radius:var(--radius-md);height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--weight-medium) 11px/1.3 var(--font-sans)}
.sw span{font:var(--weight-regular) 10px/1.4 var(--font-sans);opacity:.7}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--sky);border-radius:var(--radius-md);justify-content:center;color:var(--ink-900)"><b>12 · md</b><span>buttons, inputs</span></div>
  <div class="sw" style="background:var(--sky);border-radius:var(--radius-lg);justify-content:center;color:var(--ink-900)"><b>18 · lg</b><span>cards</span></div>
  <div class="sw" style="background:var(--sky);border-radius:var(--radius-xl);justify-content:center;color:var(--ink-900)"><b>24 · xl</b><span>media, panels</span></div>
  <div class="sw" style="background:var(--sky);border-radius:var(--radius-pill);justify-content:center;color:var(--ink-900)"><b>pill</b><span>tags</span></div>
</div>
</body></html>
