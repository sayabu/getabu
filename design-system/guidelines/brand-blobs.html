<!-- @dsCard group="Brand" viewport="700x200" subtitle="Blurred circles behind content, never in front" name="Brand Blobs" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px;background:var(--surface-page)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:78px;border-radius:var(--radius-md);height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--weight-medium) 11px/1.3 var(--font-sans)}
.sw span{font:var(--weight-regular) 10px/1.4 var(--font-sans);opacity:.7}
</style></head><body>
<div style="position:relative;height:150px;border-radius:var(--radius-xl);background:var(--paper);border:1px solid var(--border-hair);overflow:hidden">
  <div style="position:absolute;top:-70px;right:-30px;width:220px;height:220px;border-radius:50%;background:var(--sky);opacity:var(--blob-opacity-sky);filter:blur(var(--blob-blur))"></div>
  <div style="position:absolute;bottom:-100px;left:90px;width:190px;height:190px;border-radius:50%;background:var(--sun);opacity:var(--blob-opacity-sun);filter:blur(18px)"></div>
  <div style="position:relative;padding:24px;font:900 26px/1.15 var(--font-display);letter-spacing:var(--tracking-display-sm);color:var(--text-strong)">Content sits on top,<br>always at full contrast.</div>
</div>
</body></html>
