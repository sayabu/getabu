<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px;background:var(--surface-page)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:78px;border-radius:var(--radius-md);height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--weight-medium) 11px/1.3 var(--font-sans)}
.sw span{font:var(--weight-regular) 10px/1.4 var(--font-sans);opacity:.7}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--ink-900);color:#fff"><b>--text-strong</b><span>headlines</span></div>
  <div class="sw" style="background:var(--ink-600);color:#fff"><b>--text-body</b><span>paragraphs</span></div>
  <div class="sw" style="background:var(--ink-400);color:#fff"><b>--ink-400</b><span>card copy</span></div>
  <div class="sw" style="background:var(--ink-300);color:var(--ink-900)"><b>--text-muted</b><span>meta, dates</span></div>
</div>
</body></html>
