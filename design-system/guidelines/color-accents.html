<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ember, sky and coral — energy, support, warmth" name="Color Accents" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px;background:var(--surface-page)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:78px;border-radius:var(--radius-md);height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--weight-medium) 11px/1.3 var(--font-sans)}
.sw span{font:var(--weight-regular) 10px/1.4 var(--font-sans);opacity:.7}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--ember);color:#fff"><b>--ember</b><span>#FA6404</span></div>
  <div class="sw" style="background:var(--sky);color:var(--ink-900)"><b>--sky</b><span>#68CBF8</span></div>
  <div class="sw" style="background:var(--coral);color:#fff"><b>--coral</b><span>#E45863</span></div>
  <div class="sw" style="background:var(--sun-shade);color:#fff"><b>--sun-shade</b><span>#8A4A02</span></div>
</div>
</body></html>
