<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Soft and wide, never tight or dark" name="Shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px;background:var(--surface-page)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:78px;border-radius:var(--radius-md);height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font:var(--weight-medium) 11px/1.3 var(--font-sans)}
.sw span{font:var(--weight-regular) 10px/1.4 var(--font-sans);opacity:.7}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#fff;border:1px solid var(--border-hair);box-shadow:var(--shadow-card);justify-content:center;color:var(--ink-900)"><b>--shadow-card</b></div>
  <div class="sw" style="background:#fff;box-shadow:var(--shadow-lift);justify-content:center;color:var(--ink-900)"><b>--shadow-lift</b></div>
  <div class="sw" style="background:var(--sun);box-shadow:var(--shadow-sun);justify-content:center;color:var(--ink-900)"><b>--shadow-sun</b></div>
</div>
</body></html>
